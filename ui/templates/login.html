<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cognitive Load Reducer — Sign in</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center px-4">

  <div class="bg-white border border-slate-200 rounded-xl shadow-sm p-8 w-full max-w-sm">
    <div class="font-bold text-lg tracking-tight text-slate-800 mb-1">CLR</div>
    <p class="text-sm text-slate-500 mb-6">Enter the password to continue.</p>

    <form id="login-form" class="space-y-3">
      <input
        id="login-password"
        type="password"
        placeholder="Password"
        autofocus
        autocomplete="current-password"
        class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
      />
      <p id="login-error" class="text-xs text-red-500 hidden"></p>
      <button
        type="submit"
        id="login-submit"
        class="w-full bg-blue-600 text-white text-sm font-medium rounded-lg py-2 hover:bg-blue-700 transition-colors"
      >
        Sign in
      </button>
    </form>
  </div>

  <script>
    const form = document.getElementById("login-form");
    const btn = document.getElementById("login-submit");
    const errorEl = document.getElementById("login-error");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.classList.add("hidden");
      btn.disabled = true;
      btn.textContent = "Signing in...";

      try {
        const res = await fetch("/api/v1/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({ password: document.getElementById("login-password").value }),
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.detail ?? "Sign in failed");
        }
        window.location.reload();
      } catch (err) {
        errorEl.textContent = err.message || "Sign in failed";
        errorEl.classList.remove("hidden");
        btn.disabled = false;
        btn.textContent = "Sign in";
      }
    });
  </script>
</body>
</html>
